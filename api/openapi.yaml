openapi: 3.1.0
info:
  title: RezeHub API
  version: 0.1.0
  description: Target REST contract for the WebUI and Wails clients.
servers:
  - url: /api/v1
paths:
  /mods:
    get:
      operationId: listMods
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: category, in: query, schema: {type: string, enum: [submod, spritepack]}}
        - {name: platform, in: query, schema: {type: string, enum: [windows, android]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses: {'200': {$ref: '#/components/responses/ModPage'}, 'default': {$ref: '#/components/responses/Error'}}
  /mods/{mod_id}:
    get:
      operationId: getMod
      parameters: [{name: mod_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {$ref: '#/components/responses/Mod'}, 'default': {$ref: '#/components/responses/Error'}}
  /mods/{mod_id}/registrations:
    get:
      operationId: getModRegistrations
      parameters: [{name: mod_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200':
          description: Verified registration identities for this mod
          content:
            application/json:
              schema:
                type: object
                required: [mod_id, registrations]
                properties:
                  mod_id: {type: string}
                  registrations:
                    type: array
                    items: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /mods/{mod_id}/versions/{version_id}:
    get:
      operationId: getVersion
      parameters:
        - {name: mod_id, in: path, required: true, schema: {type: string}}
        - {name: version_id, in: path, required: true, schema: {type: string}}
      responses: {'200': {$ref: '#/components/responses/Version'}, 'default': {$ref: '#/components/responses/Error'}}
  /versions/{version_id}/download:
    get:
      operationId: getDownloadDescriptor
      parameters: [{name: version_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {$ref: '#/components/responses/Download'}, 'default': {$ref: '#/components/responses/Error'}}
  /session:
    get:
      operationId: getSession
      responses: {'200': {$ref: '#/components/responses/Session'}}
  /auth/flarum/login:
    post:
      operationId: loginFlarum
      description: HTTPS only. Credentials are verified by the configured Flarum server and are not stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identification, password]
              properties:
                identification: {type: string}
                password: {type: string, format: password}
      responses: {'200': {$ref: '#/components/responses/Session'}, 'default': {$ref: '#/components/responses/Error'}}
  /auth/logout:
    post:
      operationId: logout
      parameters: [{name: X-CSRF-Token, in: header, required: true, schema: {type: string}}]
      responses: {'204': {description: Session invalidated}, 'default': {$ref: '#/components/responses/Error'}}
  /admin/users/{user_id}/roles:
    get:
      operationId: getFlarumUserRoles
      description: Admin-only lookup of explicit author/reviewer grants for a Flarum numeric user ID.
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string, pattern: '^flarum:[1-9][0-9]*$'}}
      responses: {'200': {description: Current role grant}, 'default': {$ref: '#/components/responses/Error'}}
    post:
      operationId: setFlarumUserRoles
      description: Admin-only explicit author/reviewer grant for a Flarum numeric user ID. The admin role is never granted by this endpoint.
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string, pattern: '^flarum:[1-9][0-9]*$'}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles: {type: array, uniqueItems: true, items: {type: string, enum: [author, reviewer]}}
      responses: {'200': {description: Updated role grant}, 'default': {$ref: '#/components/responses/Error'}}
  /author/mods:
    get:
      operationId: listAuthorWorkspace
      description: 'Own mods only; returns one keyset window {items:[{mod,is_published,has_published_version,has_archived_version,has_pending_review,candidate_version_id}],total,page_size,start,cursor,next_cursor,prev_cursor}. No nested versions or scan reports. The version-derived flags cover every version of the mod, not just the current window, and `candidate_version_id` names the newest still-editable version that uploads should reuse. Sorted by the mod''s own created_at, newest first, missing created_at last, mod ID descending as tie-break. Windows are anchored on that (created_at, ID) key, so concurrent writes never shift a later window: `cursor` reproduces the returned window (null on the first one), `next_cursor` is null on the last window, and `prev_cursor` is null only on the first window — its empty string names the first window, so a client can always step back while it is not on the first window. `start` is the 0-based index of the first row, for display only. `focus_mod_id` resolves an owned mod to the window that contains it and returns that window''s own cursor; it outranks `cursor`, and an id the caller does not own is ignored.'
      parameters:
        - {$ref: '#/components/parameters/ReviewPageSize'}
        - {name: cursor, in: query, description: 'Keyset cursor of the window to return; omit for the first window. An empty string also means the first window, which is what the returned prev_cursor sends back.', schema: {type: string}}
        - {name: focus_mod_id, in: query, description: Return the window containing this owned mod instead of the cursor window; when both are sent the focus wins. An id the caller does not own is ignored., schema: {type: string}}
      responses:
        '200': {description: One keyset window of own mods, content: {'application/json': {schema: {$ref: '#/components/schemas/AuthorModWindow'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createAuthorMod
      responses: {'201': {description: Draft mod}, 'default': {$ref: '#/components/responses/Error'}}
  /author/submissions:
    get:
      operationId: listAuthorSubmissions
      description: Own submission history only; {items,total,page,page_size}, newest first. Items include reason, display labels, sanitized snapshots and current_version for revision.
      parameters:
        - {$ref: '#/components/parameters/ReviewPage'}
        - {$ref: '#/components/parameters/ReviewPageSize'}
        - {name: state, in: query, schema: {type: string, enum: [all, ready_for_review, approved, rejected, published]}}
      responses: {'200': {description: Own submission page}, 'default': {$ref: '#/components/responses/Error'}}
  /author/mods/{mod_id}/versions:
    get:
      operationId: listAuthorVersions
      description: Own mod versions only; {items,scan_reports,total,page,page_size}. Reports belong only to versions on this page. Sorted by created_at then ID descending, missing dates last.
      parameters:
        - {name: mod_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/ReviewPage'}
        - {$ref: '#/components/parameters/ReviewPageSize'}
      responses: {'200': {description: Own version page}, 'default': {$ref: '#/components/responses/Error'}}
    post:
      operationId: createAuthorVersion
      parameters: [{name: mod_id, in: path, required: true, schema: {type: string}}]
      responses: {'201': {description: Draft version}, 'default': {$ref: '#/components/responses/Error'}}
  /author/versions/{version_id}/archive:
    post:
      operationId: uploadAuthorArchive
      parameters: [{name: version_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [archive], properties: {archive: {type: string, format: binary}}}}}}
      responses: {'201': {description: Scan result}, 'default': {$ref: '#/components/responses/Error'}}
  /author/versions/{version_id}/submit:
    post:
      operationId: submitAuthorVersion
      parameters: [{name: version_id, in: path, required: true, schema: {type: string}}]
      responses: {'201': {description: Submission}, 'default': {$ref: '#/components/responses/Error'}}
  /review/submissions:
    get:
      operationId: listReviewSubmissions
      description: Administrator-only lightweight summaries, newest first by created_at then ID; out-of-range pages clamp to the last page.
      parameters:
        - {$ref: '#/components/parameters/ReviewPage'}
        - {$ref: '#/components/parameters/ReviewPageSize'}
        - {name: state, in: query, schema: {type: string, enum: [all, ready_for_review, approved, rejected, published]}}
      responses:
        '200': {description: Submission page, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewSubmissionPage'}}}}
        'default': {$ref: '#/components/responses/Error'}
  /review/audit:
    get:
      operationId: listReviewAudit
      description: Administrator-only events, newest first by timestamp then ID; out-of-range pages clamp to the last page.
      parameters:
        - {$ref: '#/components/parameters/ReviewPage'}
        - {$ref: '#/components/parameters/ReviewPageSize'}
      responses:
        '200': {description: Audit page, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewAuditPage'}}}}
        'default': {$ref: '#/components/responses/Error'}
  /review/submissions/{submission_id}/{action}:
    post:
      operationId: reviewSubmissionAction
      parameters:
        - {name: submission_id, in: path, required: true, schema: {type: string}}
        - {name: action, in: path, required: true, schema: {type: string, enum: [decision, publish]}}
      responses: {'200': {description: Updated submission}, 'default': {$ref: '#/components/responses/Error'}}
components:
  parameters:
    ReviewPage: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    ReviewPageSize: {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
  schemas:
    ReviewPageMetadata:
      type: object
      required: [total, page, page_size]
      properties:
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
    CursorPageMetadata:
      type: object
      description: Keyset window metadata. `start` is a display index; navigation uses the cursors only. Every value is derived from the row order, never from a page number.
      required: [total, page_size, start, cursor, next_cursor, prev_cursor]
      properties:
        total: {type: integer, minimum: 0}
        page_size: {type: integer, minimum: 1, maximum: 100}
        start: {type: integer, minimum: 0, description: 0-based index of the first returned row; display only.}
        cursor: {type: [string, 'null'], description: Reproduces the returned window; null on the first window.}
        next_cursor: {type: [string, 'null'], description: Neighbour window forward; null on the last window.}
        prev_cursor: {type: [string, 'null'], description: Neighbour window back; null only on the first window. An empty string means that neighbour is the first window.}
    AuthorModSummary:
      type: object
      description: One mod of the caller's own workspace. The version-derived fields cover every version of the mod, not only the versions visible in this window, so client affordances never depend on the current window.
      required: [mod, is_published, has_published_version, has_archived_version, has_pending_review]
      properties:
        mod: {$ref: '#/components/schemas/Mod'}
        is_published: {type: boolean, description: 'The mod is live right now: not taken down and its latest version is published.'}
        has_published_version: {type: boolean, description: 'At least one version is published, whether or not it is the latest one.'}
        has_archived_version: {type: boolean, description: 'At least one version was taken down (state unpublished). Independent of has_published_version.'}
        has_pending_review: {type: boolean, description: A version is waiting in the review queue.}
        candidate_version_id: {type: string, description: 'Newest still-editable version (draft, uploaded, rejected or scanning); an upload reuses it instead of creating a duplicate candidate.'}
    AuthorModWindow:
      description: One keyset window of own mods.
      allOf:
        - {$ref: '#/components/schemas/CursorPageMetadata'}
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/AuthorModSummary'}}
    ReviewSubmissionSummary:
      type: object
      required: [id, mod_id, version_id, author_id, state, created_at, mod_title, author_name, version_str, category]
      properties:
        id: {type: string}
        mod_id: {type: string}
        version_id: {type: string}
        author_id: {type: string}
        state: {type: string}
        created_at: {type: string, format: date-time}
        mod_title: {type: string}
        author_name: {type: string}
        version_str: {type: string}
        category: {type: string, enum: [submod, spritepack]}
    ReviewSubmissionPage:
      allOf:
        - {$ref: '#/components/schemas/ReviewPageMetadata'}
        - type: object
          required: [items, pending_count]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/ReviewSubmissionSummary'}}
            pending_count: {type: integer, minimum: 0}
    ReviewAuditPage:
      allOf:
        - {$ref: '#/components/schemas/ReviewPageMetadata'}
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                required: [id, timestamp, actor_id, actor_name, actor_role, action, target_type, target_id, target_label, reason]
                properties:
                  id: {type: string}
                  timestamp: {type: string, format: date-time}
                  actor_id: {type: string}
                  actor_name: {type: string}
                  actor_role: {type: string}
                  action: {type: string}
                  target_type: {type: string}
                  target_id: {type: string}
                  target_label: {type: string}
                  reason: {type: string}
                  details: {type: object}
    Mod:
      type: object
      required: [id, title, category, supported_platforms]
      properties:
        id: {type: string}
        title: {type: string}
        summary: {type: string}
        category: {type: string, enum: [submod, spritepack]}
        tags: {type: array, items: {type: string}}
        supported_platforms: {type: array, items: {type: string, enum: [windows, android]}}
        mas_version_range: {type: string}
        recommended_priority: {type: integer}
        latest_version_id: {type: string}
        created_at: {type: string, format: date-time, description: When the mod itself was created; the sort key of the author workspace. Mods stored before the field existed are filled by the one-off `cmd/backfill-mod-created-at` migration and sort after the dated ones until then.}
    Version:
      type: object
      required: [id, mod_id, version, state, size_bytes, sha256]
      properties:
        id: {type: string}
        mod_id: {type: string}
        version: {type: string}
        state: {type: string, enum: [published, unpublished]}
        size_bytes: {type: integer, format: int64}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        release_notes: {type: string}
        dependencies: {type: array, items: {type: object}}
        scan_report_id: {type: string}
    Page:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Mod'}}
        next_cursor: {type: [string, 'null']}
    Download:
      type: object
      required: [url, expires_at, sha256, size_bytes]
      properties:
        url: {type: string, format: uri}
        expires_at: {type: string, format: date-time}
        sha256: {type: string}
        size_bytes: {type: integer, format: int64}
    Session:
      type: object
      required: [roles, csrf_token]
      properties:
        user: {type: [object, 'null']}
        roles: {type: array, items: {type: string, enum: [user, author, reviewer, admin]}}
        csrf_token: {type: string}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        details: {type: object}
  responses:
    ModPage: {description: Catalog page, content: {application/json: {schema: {$ref: '#/components/schemas/Page'}}}}
    Mod: {description: Mod detail, content: {application/json: {schema: {$ref: '#/components/schemas/Mod'}}}}
    Version: {description: Published version, content: {application/json: {schema: {$ref: '#/components/schemas/Version'}}}}
    Download: {description: Immutable archive descriptor, content: {application/json: {schema: {$ref: '#/components/schemas/Download'}}}}
    Session: {description: Session state, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
    Error: {description: Stable error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
