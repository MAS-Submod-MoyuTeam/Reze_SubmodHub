# Log the path only: download tickets and provider signatures live in queries.
log_format delivery_safe '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
    access_log /var/log/nginx/access.log delivery_safe;
    listen 80;
    server_name _;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/archives/ {
        proxy_pass http://api:8080;
        proxy_buffering off;
        proxy_read_timeout 11m;
        proxy_send_timeout 11m;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        client_max_body_size 130m;
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # GitHub source synchronization downloads and scans every new release.
    # Large repositories can take several minutes; do not let nginx terminate
    # the synchronous import before the API has returned its summary.
    location ~ ^/api/v1/author/mods/[^/]+/github-sync$ {
        proxy_pass http://api:8080;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}
