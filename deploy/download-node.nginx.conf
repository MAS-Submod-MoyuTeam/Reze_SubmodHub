# Include log_format once in nginx's http context. Never log $request_uri or $args.
log_format node_safe '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
    listen 443 ssl;
    server_name relay.example.invalid;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    access_log /var/log/nginx/download-node.access.log node_safe;
    # Error logs can include a full request line on upstream errors. Disable them
    # for the signed endpoint, and use aggregate status/access metrics instead.
    location = /download {
        error_log /dev/null;
        proxy_pass http://127.0.0.1:18084;
        proxy_buffering off;
        proxy_read_timeout 11m;
        proxy_send_timeout 11m;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:18084;
    }
    location / { return 404; }
}
