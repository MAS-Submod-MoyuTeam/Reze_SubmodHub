<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover：Android 边到边渲染时必须声明，否则 env(safe-area-inset-*) 恒为 0，
      顶栏会被状态栏压住、右下悬浮控件会落到手势条下面。
      不写 user-scalable=no：那会剥夺用户双指缩放的权利。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>RezeHub - Monika After Story 模组枢纽平台</title>
    <meta name="description" content="RezeHub 前端设计稿与功能演示平台：面向 Monika After Story (MAS) 的模组目录、作者工作台、静态扫描报告、审核与审计管理系统。" />
    <meta property="og:title" content="RezeHub - Monika After Story 模组枢纽平台" />
    <meta property="og:description" content="RezeHub 前端设计稿与功能演示平台：面向 Monika After Story (MAS) 的模组目录、作者工作台、静态扫描报告、审核与审计管理系统。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-neutral-50 text-neutral-900 antialiased font-sans selection:bg-emerald-100 selection:text-emerald-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
